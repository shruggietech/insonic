name: Release candidate and publication
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact reviewed 40-character source commit (versions already prepared)
        required: true
        type: string
      publish:
        description: Publish the verified candidate on its existing exact version tag
        default: false
        type: boolean
      promote_docs:
        description: Promote documentation using INSONIC_DOCUMENTATION_DEPLOYMENT_JSON repository variable after publication
        default: false
        type: boolean
      documentation-transport:
        description: Explicit documentation destination (existing Pages or configured generic host)
        default: pages
        type: choice
        options: [ pages, generic ]
      highlights:
        description: Brief release highlights (publication only, at most 180 words)
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.revision }}
  cancel-in-progress: false
jobs:
  docs:
    if: inputs.publish || !inputs.promote_docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_REVISION: ${{ inputs.revision }}
      INSONIC_DOCUMENTATION_TARGET: release
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Validate exact clean source and complete repository checks
        run: |
          python scripts/release.py validate --revision "$SOURCE_REVISION"
          npm ci --ignore-scripts
          npm run check
          npm test
      - name: Build publication-target public and offline documentation
        run: |
          npm --prefix site ci --ignore-scripts
          npm --prefix site run build
          python scripts/release.py docs --revision "$SOURCE_REVISION" --output build/release/docs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: candidate-documentation-${{ inputs.revision }}-${{ github.run_attempt }}
          path: build/release/docs
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  media-linux:
    if: inputs.publish || !inputs.promote_docs
    uses: ./.github/workflows/media-source.yml
    with:
      revision: ${{ inputs.revision }}
      os: ubuntu-24.04
  qualify-linux:
    needs: media-linux
    if: always() && needs.media-linux.result == 'success' && (inputs.publish || !inputs.promote_docs)
    uses: ./.github/workflows/native-qualification.yml
    with:
      revision: ${{ inputs.revision }}
      os: ubuntu-24.04
      core: true
      cli: true
      native: true
      lane: runtime
      documentation-target: release
  package-linux:
    needs: media-linux
    if: always() && needs.media-linux.result == 'success' && (inputs.publish || !inputs.promote_docs)
    uses: ./.github/workflows/native-qualification.yml
    with:
      revision: ${{ inputs.revision }}
      os: ubuntu-24.04
      core: true
      cli: true
      native: true
      lane: packages
      documentation-target: release
      windows-sign-cert-sha1: ${{ vars.INSONIC_WINDOWS_SIGN_CERT_SHA1 }}
      signtool-executable: ${{ vars.INSONIC_SIGNTOOL_EXECUTABLE }}
      windows-sign-timestamp-url: ${{ vars.INSONIC_WINDOWS_SIGN_TIMESTAMP_URL }}
  media-windows:
    if: inputs.publish || !inputs.promote_docs
    uses: ./.github/workflows/media-source.yml
    with:
      revision: ${{ inputs.revision }}
      os: windows-2022
  qualify-windows:
    needs: media-windows
    if: always() && needs.media-windows.result == 'success' && (inputs.publish || !inputs.promote_docs)
    uses: ./.github/workflows/native-qualification.yml
    with:
      revision: ${{ inputs.revision }}
      os: windows-2022
      core: true
      cli: true
      native: true
      lane: runtime
      documentation-target: release
  package-windows:
    needs: media-windows
    if: always() && needs.media-windows.result == 'success' && (inputs.publish || !inputs.promote_docs)
    uses: ./.github/workflows/native-qualification.yml
    with:
      revision: ${{ inputs.revision }}
      os: windows-2022
      core: true
      cli: true
      native: true
      lane: packages
      documentation-target: release
      windows-sign-cert-sha1: ${{ vars.INSONIC_WINDOWS_SIGN_CERT_SHA1 }}
      signtool-executable: ${{ vars.INSONIC_SIGNTOOL_EXECUTABLE }}
      windows-sign-timestamp-url: ${{ vars.INSONIC_WINDOWS_SIGN_TIMESTAMP_URL }}
  candidate:
    needs:
      - docs
      - qualify-linux
      - package-linux
      - qualify-windows
      - package-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          skip-decompress: false
          pattern: candidate-package-*-${{ inputs.revision }}-${{ github.run_attempt }}
          path: build/release/downloads
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          skip-decompress: false
          name: candidate-documentation-${{ inputs.revision }}-${{ github.run_attempt }}
          path: build/release/downloads/documentation
      - name: Verify complete four-variant matrix, sources and documentation
        run: python scripts/release.py collect --revision "$SOURCE_REVISION" --input build/release/downloads --output build/release/candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: release-candidate-${{ github.run_attempt }}
          path: build/release/candidate
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  deployment-preflight:
    if: inputs.promote_docs && inputs.documentation-transport == 'generic' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: documentation-deployment
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REVISION: ${{ inputs.revision }}
      INSONIC_DOCUMENTATION_DEPLOYMENT_JSON: ${{ vars.INSONIC_DOCUMENTATION_DEPLOYMENT_JSON }}
      INSONIC_DOCUMENTATION_DEPLOYMENT_CREDENTIAL: ${{ secrets.INSONIC_DOCUMENTATION_DEPLOYMENT_CREDENTIAL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify protected main tooling and candidate ancestry
        run: python scripts/release.py trusted --revision "$SOURCE_REVISION"
      - name: Validate configured destination and dedicated deployment credentials before publication
        run: python scripts/release.py deployment --configuration build/release/documentation-deployment.json
  publish:
    if: always() && github.ref == 'refs/heads/main' && inputs.publish && needs.candidate.result == 'success' && (!inputs.promote_docs || (inputs.documentation-transport == 'generic' && needs.deployment-preflight.result == 'success') || (inputs.documentation-transport == 'pages' && needs.pages-preflight.result == 'success'))
    needs:
      - candidate
      - deployment-preflight
      - pages-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      checks: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REVISION: ${{ inputs.revision }}
      RELEASE_HIGHLIGHTS: ${{ inputs.highlights }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify protected main tooling and candidate ancestry before reading candidate data
        run: python scripts/release.py trusted --revision "$SOURCE_REVISION"
      - name: Check out exact candidate source as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          path: build/release/source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          skip-decompress: false
          name: release-candidate-${{ github.run_attempt }}
          path: build/release/candidate
      - name: Write brief highlights as data
        run: python -c "import os,pathlib; pathlib.Path('build/release/highlights.md').write_text(os.environ['RELEASE_HIGHLIGHTS'],encoding='utf-8',newline='\n')"
      - name: Upload complete draft, verify remote digests, then publish
        run: python scripts/release.py publish --source-root build/release/source --candidate build/release/candidate --highlights build/release/highlights.md
  promote:
    if: always() && github.ref == 'refs/heads/main' && inputs.promote_docs && inputs.documentation-transport == 'generic' && needs.deployment-preflight.result == 'success' && (!inputs.publish || needs.publish.result == 'success')
    needs:
      - publish
      - deployment-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: documentation-deployment
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REVISION: ${{ inputs.revision }}
      INSONIC_DOCUMENTATION_DEPLOYMENT_JSON: ${{ vars.INSONIC_DOCUMENTATION_DEPLOYMENT_JSON }}
      INSONIC_DOCUMENTATION_DEPLOYMENT_CREDENTIAL: ${{ secrets.INSONIC_DOCUMENTATION_DEPLOYMENT_CREDENTIAL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify protected main tooling and candidate ancestry before reading candidate data
        run: python scripts/release.py trusted --revision "$SOURCE_REVISION"
      - name: Check out exact candidate source as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          path: build/release/source
          fetch-depth: 0
          persist-credentials: false
      - name: Validate configured documentation destination
        run: python scripts/release.py deployment --configuration build/release/documentation-deployment.json
      - name: Retrieve and verify the original published candidate without rebuilding
        run: python scripts/release.py published --source-root build/release/source --revision "$SOURCE_REVISION" --output build/release/candidate
      - name: Promote matching published documentation through configured host
        run: python scripts/release.py promote --source-root build/release/source --candidate build/release/candidate --configuration build/release/documentation-deployment.json
  pages-preflight:
    if: inputs.promote_docs && inputs.documentation-transport == 'pages' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify trusted main source ancestry
        run: python scripts/release.py trusted --revision "$SOURCE_REVISION"
      - name: Verify existing Pages destination without changing configuration
        run: python scripts/release.py pages-preflight
  promote-pages:
    if: always() && github.ref == 'refs/heads/main' && inputs.promote_docs && inputs.documentation-transport == 'pages' && needs.pages-preflight.result == 'success' && (!inputs.publish || needs.publish.result == 'success')
    needs:
      - publish
      - pages-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify trusted main tooling and source ancestry
        run: python scripts/release.py trusted --revision "$SOURCE_REVISION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          path: build/release/source
          fetch-depth: 0
          persist-credentials: false
      - name: Retrieve original exact published assets
        run: python scripts/release.py published --source-root build/release/source --revision "$SOURCE_REVISION" --output build/release/candidate
      - name: Promote verified original documentation and verify exact Pages build
        run: python scripts/release.py pages-promote --source-root build/release/source --candidate build/release/candidate
