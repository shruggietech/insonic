name: Native runtime and package qualification
on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      os:
        required: true
        type: string
      core:
        required: true
        type: boolean
      cli:
        required: true
        type: boolean
      native:
        required: true
        type: boolean
      lane:
        required: false
        default: both
        type: string
      documentation-target:
        type: string
        default: snapshot
      reuse-ci-offline-help:
        type: boolean
        default: false
      reuse-ci-go-dependencies:
        type: boolean
        default: false
      overlap-source-setup:
        type: boolean
        default: false
      windows-sign-cert-sha1:
        type: string
        default: ''
      signtool-executable:
        type: string
        default: ''
      windows-sign-timestamp-url:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  runtime_checks:
    if: inputs.core && inputs.lane != 'packages'
    name: native-${{ matrix.runtime_lane }} (${{ inputs.os }})
    strategy:
      fail-fast: false
      matrix:
        runtime_lane: ${{ inputs.native && fromJSON('["engine","desktop"]') || fromJSON('["engine"]') }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 11
    env:
      NEXT_TELEMETRY_DISABLED: 1
      SOURCE_REVISION: ${{ inputs.revision }}
      INSONIC_DOCUMENTATION_TARGET: ${{ inputs.documentation-target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
          fetch-depth: ${{ inputs.reuse-ci-offline-help && 1 || 0 }}
      - name: Check out exact workflow bootstrap tooling
        if: inputs.revision != job.workflow_sha
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: build/automation
          sparse-checkout: |
            scripts/bootstrap-actions.py
            scripts/bootstrap-actions.lock.json
            scripts/http_read.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Acquire verified setup-go action with bounded retries
        if: inputs.core
        run: python "${{ inputs.revision == job.workflow_sha && '.' || 'build/automation' }}/scripts/bootstrap-actions.py" setup-go --output build/actions/setup-go
      - if: inputs.core
        uses: ./build/actions/setup-go # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            internal/qualification/dependencies.json
            .github/workflows/cache-keys/native-${{ matrix.runtime_lane }}
      - name: Acquire verified setup-node action with bounded retries
        if: inputs.native && matrix.runtime_lane == 'desktop'
        run: python "${{ inputs.revision == job.workflow_sha && '.' || 'build/automation' }}/scripts/bootstrap-actions.py" setup-node --output build/actions/setup-node
      - if: inputs.native && matrix.runtime_lane == 'desktop'
        uses: ./build/actions/setup-node # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/frontend/package-lock.json
            site/package-lock.json
      - name: Linux webview dependencies
        if: runner.os == 'Linux' && inputs.native && matrix.runtime_lane == 'desktop'
        run: |
          # The runner's Azure HTTP mirror can consume the complete job budget.
          # Preserve suites/components/signatures while using Ubuntu HTTPS.
          sudo python3 scripts/prepare-apt-mirror.py
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav xvfb gnome-keyring dbus-x11 cmake ninja-build pkg-config nasm
      - name: Windows native compiler and loader dependencies
        if: runner.os == 'Windows' && inputs.core
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-openssl make diffutils
      - name: Bind the installed Windows toolchain
        if: runner.os == 'Windows' && inputs.core
        env:
          SELECTED_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: python -c "import os; assert os.environ['SELECTED_MSYS2_ROOT']; open(os.environ['GITHUB_ENV'],'a',encoding='utf-8',newline='\n').write('INSONIC_MSYS2_ROOT='+os.environ['SELECTED_MSYS2_ROOT']+'\n')"
      - name: Pinned Windows archive decoder
        if: runner.os == 'Windows' && inputs.native
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --target build/native/python zstandard==0.25.0
      - name: Pinned native artifacts
        if: inputs.native
        run: python scripts/qualify.py prepare
      - name: Download exact same-run source build
        if: inputs.core
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          skip-decompress: false
          name: media-source-${{ inputs.os }}-${{ github.run_attempt }}
          path: build/transfer
      - name: Verify source build transfer before reuse
        if: inputs.core
        shell: bash
        run: python scripts/media-transfer.py restore --stage complete --revision "$SOURCE_REVISION" build/transfer/media-source.tar.gz
      - name: Pinned metadata extractors and real media operations
        if: inputs.core && matrix.runtime_lane == 'engine'
        run: python scripts/media-tools.py
      - name: Prepare pinned metadata extractors for desktop qualification
        if: inputs.core && matrix.runtime_lane == 'desktop'
        run: python scripts/media-tools.py --prepare-only
      - name: Real native dependency operations
        if: inputs.native && matrix.runtime_lane == 'engine'
        run: python scripts/qualify.py native
      - name: Cross-process CLI acceptance
        if: inputs.cli && matrix.runtime_lane == 'engine'
        run: python scripts/qualify.py cli ${{ inputs.native && '--native' || '' }}
      - name: Native credential lifecycle on Windows
        if: inputs.native && matrix.runtime_lane == 'desktop' && runner.os != 'Linux'
        run: python scripts/qualify.py secrets
      - name: Native credential lifecycle in private Linux Secret Service
        if: inputs.native && matrix.runtime_lane == 'desktop' && runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            fixture_root=$(mktemp -d)
            trap "rm -rf -- \"$fixture_root\"" EXIT
            export XDG_DATA_HOME="$fixture_root/data"
            export GNOME_KEYRING_CONTROL="$fixture_root/control"
            mkdir -p "$XDG_DATA_HOME" "$GNOME_KEYRING_CONTROL"
            python -c "import secrets,sys; sys.stdout.write(secrets.token_hex(32))" |
              gnome-keyring-daemon --daemonize --unlock --components=secrets --control-directory "$GNOME_KEYRING_CONTROL" >/dev/null
            python scripts/qualify.py secrets
          '
      - name: Download exact same-run documentation export
        if: inputs.reuse-ci-offline-help && inputs.native && matrix.runtime_lane == 'desktop'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          digest-mismatch: error
          skip-decompress: false
          name: candidate-documentation-${{ inputs.revision }}-${{ github.run_attempt }}
          path: build/documentation-transfer
      - name: Restore verified same-run offline help
        if: inputs.reuse-ci-offline-help && inputs.native && matrix.runtime_lane == 'desktop'
        run: python scripts/site-transfer.py restore --revision '${{ inputs.revision }}' --directory build/documentation-transfer
      - name: Install package notice inputs
        if: inputs.native && matrix.runtime_lane == 'desktop'
        run: |
          npm --prefix desktop/frontend ci --ignore-scripts
          npm --prefix site ci --ignore-scripts
      - name: Build independent release help
        if: inputs.native && matrix.runtime_lane == 'desktop' && !inputs.reuse-ci-offline-help
        run: npm --prefix site run build
      - name: Stage qualified local help and brand assets
        if: inputs.native && matrix.runtime_lane == 'desktop'
        run: python scripts/qualify.py assets
      - name: Check and build desktop frontend
        if: inputs.native && matrix.runtime_lane == 'desktop'
        run: |
          npm --prefix desktop/frontend run check
          npm --prefix desktop/frontend test
          npm --prefix desktop/frontend run build
      - name: Desktop shared bridge qualification
        if: inputs.native && matrix.runtime_lane == 'desktop'
        run: python scripts/qualify.py desktop
      - name: Qualify unattended application screenshots
        if: inputs.native && matrix.runtime_lane == 'desktop' && runner.os == 'Windows'
        run: |
          npm ci --ignore-scripts
          python scripts/qualify-ui-capture.py --output build/ui-capture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && inputs.native && matrix.runtime_lane == 'desktop' && runner.os == 'Windows'
        with:
          archive: true
          name: application-ui-capture-${{ inputs.revision }}-${{ github.run_attempt }}
          path: build/ui-capture
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.core
        with:
          archive: true
          name: native-receipts-${{ matrix.runtime_lane }}-${{ inputs.os }}-${{ inputs.revision }}-${{ github.run_attempt }}
          path: |
            build/native/*receipt.json
            build/native/package-inventory.json
            build/ui-capture
          if-no-files-found: error
  runtime:
    if: always() && inputs.core && inputs.lane != 'packages'
    needs:
      - runtime_checks
    name: native (${{ inputs.os }})
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - name: Require every elected runtime lane
        env:
          QUALIFICATION_RESULT: ${{ needs.runtime_checks.result }}
        run: python -c "import os; assert os.environ['QUALIFICATION_RESULT'] == 'success', 'native qualification lane failed or was skipped'"
  packages:
    if: inputs.native && inputs.lane != 'runtime'
    name: package (${{ inputs.os }}, ${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ inputs.os == 'windows-2022' && fromJSON('["cli"]') || fromJSON('["cli","desktop"]') }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 11
    permissions:
      contents: read
      actions: read
    env:
      NEXT_TELEMETRY_DISABLED: 1
      SOURCE_REVISION: ${{ inputs.revision }}
      INSONIC_DOCUMENTATION_TARGET: ${{ inputs.documentation-target }}
      INSONIC_WINDOWS_SIGN_CERT_SHA1: ${{ inputs.windows-sign-cert-sha1 }}
      INSONIC_SIGNTOOL_EXECUTABLE: ${{ inputs.signtool-executable }}
      INSONIC_WINDOWS_SIGN_TIMESTAMP_URL: ${{ inputs.windows-sign-timestamp-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
          fetch-depth: ${{ inputs.reuse-ci-offline-help && 1 || 0 }}
      - name: Check out exact workflow bootstrap tooling
        if: inputs.revision != job.workflow_sha
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: build/automation
          sparse-checkout: |
            scripts/bootstrap-actions.py
            scripts/bootstrap-actions.lock.json
            scripts/http_read.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Acquire verified setup-go action with bounded retries
        if: inputs.core
        run: python "${{ inputs.revision == job.workflow_sha && '.' || 'build/automation' }}/scripts/bootstrap-actions.py" setup-go --output build/actions/setup-go
      - if: inputs.core
        uses: ./build/actions/setup-go # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ !(inputs.reuse-ci-go-dependencies && runner.os == 'Windows') }}
          cache-dependency-path: |
            go.sum
            internal/qualification/dependencies.json
            ${{ matrix.variant == 'desktop' && 'desktop/frontend/package-lock.json' || 'internal/contracts/contracts.go' }}
      - name: Acquire verified setup-node action with bounded retries
        if: inputs.native
        run: python "${{ inputs.revision == job.workflow_sha && '.' || 'build/automation' }}/scripts/bootstrap-actions.py" setup-node --output build/actions/setup-node
      - if: inputs.native
        uses: ./build/actions/setup-node # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/frontend/package-lock.json
            site/package-lock.json
      - name: Linux webview dependencies
        if: runner.os == 'Linux' && inputs.native && matrix.variant == 'desktop'
        run: |
          # The runner's Azure HTTP mirror can consume the complete job budget.
          # Preserve suites/components/signatures while using Ubuntu HTTPS.
          sudo python3 scripts/prepare-apt-mirror.py
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav xvfb gnome-keyring dbus-x11 cmake ninja-build pkg-config nasm
      - name: Windows native compiler and loader dependencies
        if: runner.os == 'Windows' && inputs.core
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-openssl make diffutils
      - name: Bind the installed Windows toolchain
        if: runner.os == 'Windows' && inputs.core
        env:
          SELECTED_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: python -c "import os; assert os.environ['SELECTED_MSYS2_ROOT']; open(os.environ['GITHUB_ENV'],'a',encoding='utf-8',newline='\n').write('INSONIC_MSYS2_ROOT='+os.environ['SELECTED_MSYS2_ROOT']+'\n')"
      - name: Pinned Windows archive decoder
        if: runner.os == 'Windows' && inputs.native
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --target build/native/python zstandard==0.25.0
      - name: Await successful CI foundation and documentation within the original deadline
        if: inputs.overlap-source-setup && inputs.reuse-ci-offline-help
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-acceptance.mjs wait-inputs
      - name: Await exact same-run source after overlapping consumer setup
        if: inputs.overlap-source-setup && inputs.core
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-ci-artifact.mjs '${{ inputs.os }}'
      - name: Pinned native artifacts
        if: inputs.native
        run: python scripts/qualify.py prepare
      - name: Download exact same-attempt prepared Go dependencies
        if: inputs.reuse-ci-go-dependencies && runner.os == 'Windows'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          digest-mismatch: error
          skip-decompress: false
          name: go-dependencies-windows-${{ inputs.revision }}-${{ github.run_attempt }}
          path: build/dependency-transfer
      - name: Download exact same-run source build
        if: inputs.core
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          skip-decompress: false
          name: media-source-${{ inputs.os }}-${{ github.run_attempt }}
          path: build/transfer
      - name: Join independent verified CI inputs and notice installations
        if: inputs.reuse-ci-go-dependencies && runner.os == 'Windows'
        run: python scripts/ci-package-inputs.py
      - name: Verify source build transfer before reuse
        if: inputs.core && !(inputs.reuse-ci-go-dependencies && runner.os == 'Windows')
        shell: bash
        run: python scripts/media-transfer.py restore --stage complete --revision "$SOURCE_REVISION" build/transfer/media-source.tar.gz
      - name: Prepare pinned metadata extractors for package qualification
        if: inputs.core && !(inputs.reuse-ci-go-dependencies && runner.os == 'Windows')
        run: python scripts/media-tools.py --prepare-only
      - name: Download exact same-run documentation export
        if: inputs.reuse-ci-offline-help && inputs.native
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          digest-mismatch: error
          skip-decompress: false
          name: candidate-documentation-${{ inputs.revision }}-${{ github.run_attempt }}
          path: build/documentation-transfer
      - name: Restore verified same-run offline help
        if: inputs.reuse-ci-offline-help && inputs.native
        run: python scripts/site-transfer.py restore --revision '${{ inputs.revision }}' --directory build/documentation-transfer
      - name: Install package notice inputs
        if: inputs.native && !(inputs.reuse-ci-go-dependencies && runner.os == 'Windows')
        run: |
          npm --prefix desktop/frontend ci --ignore-scripts
          npm --prefix site ci --ignore-scripts
      - name: Build independent release help
        if: inputs.native && !inputs.reuse-ci-offline-help
        run: npm --prefix site run build
      - name: Stage qualified local help and brand assets
        if: inputs.native
        run: python scripts/qualify.py assets
      - name: Build this desktop package frontend
        if: inputs.native && matrix.variant == 'desktop'
        run: |
          npm --prefix desktop/frontend run build
      - name: Assemble and qualify this relocated native package variant
        if: inputs.native
        run: python scripts/package-desktop.py all --variant ${{ matrix.variant }}
      - name: Retain qualified candidate package bytes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && inputs.native
        with:
          archive: true
          name: candidate-package-${{ inputs.os }}-${{ matrix.variant }}-${{ inputs.revision }}-${{ github.run_attempt }}
          path: |
            build/packages/*.zip
            build/packages/*.tar.gz
            build/native/package-${{ matrix.variant }}-receipt.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.core
        with:
          archive: true
          name: package-receipts-${{ inputs.os }}-${{ matrix.variant }}-${{ inputs.revision }}-${{ github.run_attempt }}
          path: |
            build/native/*receipt.json
            build/native/package-inventory.json
          if-no-files-found: error
  windows-desktop:
    permissions:
      contents: read
      actions: read
    if: inputs.native && inputs.os == 'windows-2022' && inputs.lane != 'runtime'
    uses: ./.github/workflows/windows-desktop-qualification.yml
    with:
      revision: ${{ inputs.revision }}
      os: ${{ inputs.os }}
      core: ${{ inputs.core }}
      cli: ${{ inputs.cli }}
      native: ${{ inputs.native }}
      documentation-target: ${{ inputs.documentation-target }}
      reuse-ci-offline-help: ${{ inputs.reuse-ci-offline-help }}
      reuse-ci-go-dependencies: ${{ inputs.reuse-ci-go-dependencies }}
      overlap-source-setup: ${{ inputs.overlap-source-setup }}
      windows-sign-cert-sha1: ${{ inputs.windows-sign-cert-sha1 }}
      signtool-executable: ${{ inputs.signtool-executable }}
      windows-sign-timestamp-url: ${{ inputs.windows-sign-timestamp-url }}
