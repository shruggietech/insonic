name: Installer invocation diagnostic
on:
  workflow_dispatch:
    inputs:
      startup_hide:
        description: Mirror the Go parent's explicit startup-hide flags in the cold-start comparison
        type: boolean
        default: false
      startup_cold:
        description: Observe only fresh no-workspace close startup, stopping at the first failure
        type: boolean
        default: false
      startup_load:
        description: Overlap the maintained installed CLI workload with native startup
        type: boolean
        default: false
      startup_source:
        description: Build the current diagnostic GUI and observe the full archive GUI launch order
        type: boolean
        default: false
      kind:
        description: Focused diagnostic boundary (never product qualification)
        type: choice
        default: completion
        options: [completion, keyboard, rollback, msiexec, recovery, exit, container, container-independent, container-compare, standalone, standalone-full, recovery-compare, setup, setup-full, setup-compare, desktop-startup]
permissions:
  contents: read
  actions: read
jobs:
  invocation:
    name: diagnostic ${{ matrix.kind }} (does not qualify MSI)
    strategy:
      fail-fast: false
      matrix:
        kind: ${{ fromJSON(inputs.kind == 'setup-compare' && '["setup","setup-full"]' || inputs.kind == 'recovery-compare' && '["container","container-independent","standalone","standalone-full"]' || inputs.kind == 'container-compare' && '["container","container-independent"]' || format('["{0}"]', inputs.kind)) }}
    runs-on: windows-2022
    timeout-minutes: ${{ matrix.kind == 'desktop-startup' && inputs.startup_source && 11 || 5 }}
    env:
      INSONIC_DISPOSABLE_INSTALLER_TEST: '1'
      INSONIC_INSTALLER_DIAGNOSTIC_KIND: ${{ matrix.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python scripts/bootstrap-actions.py setup-go --output build/actions/setup-go
      - uses: ./build/actions/setup-go
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare production-matching Windows compiler for source diagnosis
        if: matrix.kind == 'desktop-startup' && inputs.startup_source
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-openssl make diffutils
      - name: Bind the diagnostic compiler
        if: matrix.kind == 'desktop-startup' && inputs.startup_source
        env:
          SELECTED_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: python -c "import os; assert os.environ['SELECTED_MSYS2_ROOT']; open(os.environ['GITHUB_ENV'],'a',encoding='utf-8',newline='\n').write('INSONIC_MSYS2_ROOT='+os.environ['SELECTED_MSYS2_ROOT']+'\n')"
      - name: Pinned archive decoder for source diagnosis
        if: matrix.kind == 'desktop-startup' && inputs.startup_source
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --target build/native/python zstandard==0.25.0
      - name: Prepare pinned native inputs for source diagnosis
        if: matrix.kind == 'desktop-startup' && inputs.startup_source
        run: python scripts/qualify.py prepare
      - name: Acquire pinned Node setup for source diagnosis
        if: matrix.kind == 'desktop-startup' && inputs.startup_source
        run: python scripts/bootstrap-actions.py setup-node --output build/actions/setup-node
      - if: matrix.kind == 'desktop-startup' && inputs.startup_source
        uses: ./build/actions/setup-node
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install selected frontend inputs
        if: matrix.kind == 'desktop-startup' && inputs.startup_source
        run: npm --prefix desktop/frontend ci --ignore-scripts
      - name: Restore immutable incident source authority
        if: matrix.kind == 'desktop-startup'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d44d95b6e97d741a32cbf87323bf78c824c3155b
          path: build/incident-source
          persist-credentials: false
      - name: Restore exact failed-main desktop for startup diagnosis
        if: matrix.kind == 'desktop-startup'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          digest-mismatch: error
          skip-decompress: false
          github-token: ${{ github.token }}
          run-id: 39097965060
          name: windows-desktop-input-d44d95b6e97d741a32cbf87323bf78c824c3155b-1
          path: build/windows-desktop-input
      - name: Observe exact incident desktop startup without installer transactions
        if: matrix.kind == 'desktop-startup'
        env:
          SOURCE_REVISION: d44d95b6e97d741a32cbf87323bf78c824c3155b
          INSONIC_STARTUP_SOURCE: ${{ inputs.startup_source }}
          INSONIC_STARTUP_COLD: ${{ inputs.startup_cold }}
          INSONIC_STARTUP_HIDE: ${{ inputs.startup_hide }}
          INSONIC_STARTUP_LOAD: ${{ inputs.startup_load }}
        run: python scripts/diagnose-desktop-startup.py
      - name: Trace one documentation completion invocation
        if: matrix.kind != 'desktop-startup'
        run: python scripts/diagnose-installer-completion.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          archive: true
          name: installer-invocation-diagnostic-${{ matrix.kind }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/completion-invocation-diagnostic/evidence
            build/desktop-startup-diagnostic/evidence
          if-no-files-found: warn
          retention-days: 7
