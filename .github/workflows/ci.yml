name: CI
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      site_smoke:
        description: Read-only production byte, download and browser verification
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    name: scope
    outputs:
      core: ${{ steps.scope.outputs.core }}
      cli: ${{ steps.scope.outputs.cli }}
      native: ${{ steps.scope.outputs.native }}
      adapters: ${{ steps.scope.outputs.adapters }}
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify affected components with runner Node
        id: scope
        run: node scripts/ci-scope.mjs
        env:
          INSONIC_CI_SITE_SMOKE: ${{ github.event_name == 'workflow_dispatch' && inputs.site_smoke }}
  foundation:
    name: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Acquire verified setup-node action with bounded retries
        run: python scripts/bootstrap-actions.py setup-node --output build/actions/setup-node
      - uses: ./build/actions/setup-node # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
  docs-build:
    name: docs-build
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Acquire verified setup-node action with bounded retries
        run: python scripts/bootstrap-actions.py setup-node --output build/actions/setup-node
      - uses: ./build/actions/setup-node # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm --prefix site ci --ignore-scripts
      - run: npm --prefix site test
      - run: npm --prefix site run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Package exact-source candidate documentation
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: python scripts/release.py docs --revision "$SOURCE_REVISION" --output build/release/docs
      - name: Bind same-run documentation transfer
        run: python scripts/site-transfer.py pack --revision '${{ github.sha }}' --directory build/release/docs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: candidate-documentation-${{ github.sha }}-${{ github.run_attempt }}
          path: build/release/docs
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  docs:
    name: docs
    needs: docs-build
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Acquire verified setup-node action with bounded retries
        run: python scripts/bootstrap-actions.py setup-node --output build/actions/setup-node
      - uses: ./build/actions/setup-node # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm --prefix site ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          digest-mismatch: error
          skip-decompress: false
          name: candidate-documentation-${{ github.sha }}-${{ github.run_attempt }}
          path: build/documentation-transfer
      - name: Restore exact documentation exports
        run: python scripts/site-transfer.py restore --revision '${{ github.sha }}' --directory build/documentation-transfer
      - name: Qualify local public and offline diagram rendering
        run: python scripts/qualify-docs-renderer.py
      - name: Qualify responsive public and offline documentation
        run: node scripts/check-docs-ui.mjs --browser /usr/bin/google-chrome --out site/out --offline site/offline --output build/s028-docs-ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          archive: true
          name: documentation-ui-${{ github.sha }}-${{ github.run_attempt }}
          path: build/s028-docs-ui
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: documentation-${{ github.sha }}-${{ github.run_attempt }}
          path: site/out
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: offline-help-${{ github.sha }}-${{ github.run_attempt }}
          path: site/offline
          if-no-files-found: error
          retention-days: 14
  media-linux:
    needs: scope
    if: needs.scope.outputs.native == 'true' || needs.scope.outputs.adapters == 'true'
    uses: ./.github/workflows/media-source.yml
    with:
      revision: ${{ github.sha }}
      os: ubuntu-24.04
  qualify-linux:
    needs:
      - scope
      - foundation
      - docs-build
      - media-linux
    if: always() && needs.foundation.result == 'success' && needs.docs-build.result == 'success' && needs.scope.outputs.core == 'true' && needs.media-linux.result == 'success'
    uses: ./.github/workflows/native-qualification.yml
    with:
      reuse-ci-offline-help: true
      revision: ${{ github.sha }}
      os: ubuntu-24.04
      core: ${{ needs.scope.outputs.core == 'true' }}
      cli: ${{ needs.scope.outputs.cli == 'true' }}
      native: ${{ needs.scope.outputs.native == 'true' }}
      lane: runtime
  package-linux:
    needs:
      - scope
      - foundation
      - docs-build
      - media-linux
    if: always() && needs.foundation.result == 'success' && needs.docs-build.result == 'success' && needs.scope.outputs.native == 'true' && needs.media-linux.result == 'success'
    uses: ./.github/workflows/native-qualification.yml
    with:
      reuse-ci-offline-help: true
      revision: ${{ github.sha }}
      os: ubuntu-24.04
      core: true
      cli: true
      native: true
      lane: packages
  media-windows:
    needs: scope
    if: needs.scope.outputs.native == 'true' || needs.scope.outputs.adapters == 'true'
    uses: ./.github/workflows/media-source.yml
    with:
      revision: ${{ github.sha }}
      os: windows-2022
  qualify-windows:
    needs:
      - scope
      - foundation
      - docs-build
      - media-windows
    if: always() && needs.foundation.result == 'success' && needs.docs-build.result == 'success' && needs.scope.outputs.core == 'true' && needs.media-windows.result == 'success'
    uses: ./.github/workflows/native-qualification.yml
    with:
      reuse-ci-offline-help: true
      revision: ${{ github.sha }}
      os: windows-2022
      core: ${{ needs.scope.outputs.core == 'true' }}
      cli: ${{ needs.scope.outputs.cli == 'true' }}
      native: ${{ needs.scope.outputs.native == 'true' }}
      lane: runtime
  package-windows:
    needs:
      - scope
    if: needs.scope.outputs.native == 'true'
    uses: ./.github/workflows/native-qualification.yml
    with:
      reuse-ci-offline-help: true
      overlap-source-setup: true
      revision: ${{ github.sha }}
      os: windows-2022
      core: true
      cli: true
      native: true
      lane: packages
  candidate:
    needs:
      - foundation
      - docs
      - package-linux
      - package-windows
      - media-windows
    if: always() && needs.foundation.result == 'success' && needs.docs.result == 'success' && needs.package-linux.result == 'success' && needs.package-windows.result == 'success' && needs.media-windows.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    permissions:
      contents: read
    env:
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Acquire verified setup-go action with bounded retries
        run: python scripts/bootstrap-actions.py setup-go --output build/actions/setup-go
      - name: Read shipped Go binary metadata
        uses: ./build/actions/setup-go
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          skip-decompress: false
          pattern: candidate-package-*-${{ github.sha }}-${{ github.run_attempt }}
          path: build/release/downloads
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          skip-decompress: false
          name: candidate-documentation-${{ github.sha }}-${{ github.run_attempt }}
          path: build/release/downloads/documentation
      - name: Verify the complete exact-source candidate
        run: python scripts/release.py collect --revision "$SOURCE_REVISION" --input build/release/downloads --output build/release/candidate --summary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: build/release/candidate
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  core:
    needs: [foundation, scope]
    if: needs.scope.outputs.core == 'true'
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Acquire verified setup-go action with bounded retries
        run: python scripts/bootstrap-actions.py setup-go --output build/actions/setup-go
      - uses: ./build/actions/setup-go
        with:
          go-version-file: go.mod
          cache: true
      - name: Acquire verified setup-node action with bounded retries
        run: python scripts/bootstrap-actions.py setup-node --output build/actions/setup-node
      - uses: ./build/actions/setup-node # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Release schema test dependencies
        run: npm ci --ignore-scripts
      - name: Core acceptance
        shell: bash
        run: |
          go test ./...
          go vet ./...
          python -m unittest discover -s tests -p '*_test.py'
  core-windows:
    needs: [foundation, scope]
    if: needs.scope.outputs.core == 'true'
    name: core (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Acquire verified setup-go action with bounded retries
        run: python scripts/bootstrap-actions.py setup-go --output build/actions/setup-go
      - uses: ./build/actions/setup-go
        with:
          go-version-file: go.mod
          cache: true
      - name: Acquire verified setup-node action with bounded retries
        run: python scripts/bootstrap-actions.py setup-node --output build/actions/setup-node
      - uses: ./build/actions/setup-node # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Release schema test dependencies
        run: npm ci --ignore-scripts
      - name: Windows native compiler and loader dependencies
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-openssl
      - name: Bind the installed Windows toolchain
        env:
          SELECTED_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: python -c "import os; assert os.environ['SELECTED_MSYS2_ROOT']; open(os.environ['GITHUB_ENV'],'a',encoding='utf-8',newline='\n').write('INSONIC_MSYS2_ROOT='+os.environ['SELECTED_MSYS2_ROOT']+'\n')"
      - name: Core acceptance
        shell: bash
        run: |
          go test ./...
          go vet ./...
          python -m unittest discover -s tests -p '*_test.py'
  adapters:
    needs:
      - scope
      - foundation
      - media-linux
    if: always() && needs.foundation.result == 'success' && needs.scope.outputs.adapters == 'true' && needs.media-linux.result == 'success'
    name: adapter fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    services:
      postgres:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: fixture
        ports: [ '5432:5432' ]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
      s3:
        image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
        ports: [ '9090:9090' ]
      arcade:
        image: arcadedata/arcadedb:26.9.1@sha256:02a1a74fcef3c9d91e680262ddb7fde05ff9cfb356b366e7faf8e41d80995a70
        env:
          ARCADEDB_SETTINGS: -Darcadedb.server.rootPassword=fixture-only-password -Darcadedb.dumpConfigAtStartup=false
          ARCADEDB_OPTS_MEMORY: -Xms128M -Xmx512M
        ports: [ '2480:2480' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Acquire verified setup-go action with bounded retries
        run: python scripts/bootstrap-actions.py setup-go --output build/actions/setup-go
      - uses: ./build/actions/setup-go
        with:
          go-version-file: go.mod
          cache: true
      - name: Wait for bounded service fixtures
        run: |
          python - <<'PY'
          import time, urllib.request
          for url in ['http://localhost:9090/favicon.ico', 'http://localhost:2480/api/v1/ready']:
              for attempt in range(40):
                  try:
                      with urllib.request.urlopen(url, timeout=2):
                          break
                  except Exception:
                      time.sleep(2)
              else:
                  raise SystemExit('fixture did not become ready')
          PY
      - name: Download exact Linux source build for backend qualification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          skip-decompress: false
          name: media-source-ubuntu-24.04-${{ github.run_attempt }}
          path: build/transfer
      - name: Qualify alternative-backend operations
        env:
          INSONIC_FIXTURE_POSTGRES: postgres://fixture:fixture-only-password@localhost:5432/fixture?sslmode=disable
          INSONIC_FIXTURE_S3: localhost:9090
          INSONIC_FIXTURE_ARCADE: http://localhost:2480
          INSONIC_LIBRARY_TOOLS_FILE: ${{ github.workspace }}/build/native/media-tools.json
        run: |
          python scripts/media-transfer.py restore --stage complete --revision '${{ github.sha }}' build/transfer/media-source.tar.gz
          python scripts/media-tools.py --prepare-only
          go test -v -p 1 -tags integration ./internal/qualification ./internal/backendsetup ./internal/catalog ./internal/artifact ./internal/models ./internal/library ./internal/graph ./internal/app ./internal/backup
  live-site:
    if: github.event_name == 'workflow_dispatch' && inputs.site_smoke
    name: read-only live website
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out deployed branch as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gh-pages
          path: build/deployed
          persist-credentials: false
      - run: python scripts/bootstrap-actions.py setup-node --output build/actions/setup-node
      - uses: ./build/actions/setup-node
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify deployed branch against live HTTPS and package links
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pages_commit=$(git -C build/deployed rev-parse HEAD)
          python scripts/website.py verify-deployed --site-tree build/deployed --pages-commit "$pages_commit" --output build/live-site/live.json
      - name: Measure actual live landing layouts
        run: node scripts/check-live-site-ui.mjs --receipt build/live-site/live.json --output build/live-site/ui --browser /usr/bin/google-chrome
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          archive: true
          name: live-site-${{ github.sha }}-${{ github.run_attempt }}
          path: build/live-site
          if-no-files-found: warn
          retention-days: 14
