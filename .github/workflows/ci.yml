name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    name: foundation
    outputs:
      core: ${{ steps.scope.outputs.core }}
      cli: ${{ steps.scope.outputs.cli }}
      native: ${{ steps.scope.outputs.native }}
      adapters: ${{ steps.scope.outputs.adapters }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Classify affected components
        id: scope
        run: node scripts/ci-scope.mjs
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm --prefix site ci --ignore-scripts
      - run: npm --prefix site run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-${{ github.sha }}
          path: site/out
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-help-${{ github.sha }}
          path: site/offline
          if-no-files-found: error
          retention-days: 14
  media:
    needs: foundation
    if: needs.foundation.outputs.native == 'true' || needs.foundation.outputs.adapters == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    uses: ./.github/workflows/media-source.yml
    with:
      revision: ${{ github.sha }}
      os: ${{ matrix.os }}
  native:
    needs: [foundation, media]
    if: always() && needs.foundation.result == 'success' && (needs.media.result == 'success' || needs.media.result == 'skipped')
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: 1
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - if: needs.foundation.outputs.core == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - if: needs.foundation.outputs.native == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Linux webview dependencies
        if: runner.os == 'Linux' && needs.foundation.outputs.native == 'true'
        run: |
          # The runner's Azure HTTP mirror can consume the complete job budget.
          # Preserve suites/components/signatures while using Ubuntu HTTPS.
          sudo python3 - <<'PY'
          from pathlib import Path
          import re
          for path in [Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.sources'), *Path('/etc/apt/sources.list.d').glob('*.list')]:
              if path.is_file():
                  original = path.read_text()
                  updated = re.sub(r'https?://azure[.]archive[.]ubuntu[.]com/ubuntu', 'https://archive.ubuntu.com/ubuntu', original)
                  if updated != original:
                      path.write_text(updated)
          PY
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav xvfb gnome-keyring dbus-x11 cmake ninja-build pkg-config nasm
      - name: Windows native compiler and loader dependencies
        if: runner.os == 'Windows' && needs.foundation.outputs.core == 'true'
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-openssl make diffutils
      - name: Bind the installed Windows toolchain
        if: runner.os == 'Windows' && needs.foundation.outputs.core == 'true'
        env:
          SELECTED_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: python -c "import os; assert os.environ['SELECTED_MSYS2_ROOT']; open(os.environ['GITHUB_ENV'],'a',encoding='utf-8',newline='\n').write('INSONIC_MSYS2_ROOT='+os.environ['SELECTED_MSYS2_ROOT']+'\n')"
      - name: Core acceptance
        if: needs.foundation.outputs.core == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          npm ci --ignore-scripts
          go test ./...
          go vet ./...
          python -m unittest discover -s tests -p '*_test.py'
      - name: Pinned Windows archive decoder
        if: runner.os == 'Windows' && needs.foundation.outputs.native == 'true'
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --target build/native/python zstandard==0.25.0
      - name: Pinned native artifacts
        if: needs.foundation.outputs.native == 'true'
        run: python scripts/qualify.py prepare
      - name: Download exact same-run source build
        if: needs.foundation.outputs.core == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: media-source-${{ matrix.os }}
          path: build/transfer
      - name: Verify source build transfer before reuse
        if: needs.foundation.outputs.core == 'true'
        shell: bash
        run: python scripts/media-transfer.py restore --stage complete --revision "$SOURCE_REVISION" build/transfer/media-source.tar.gz
      - name: Pinned metadata extractors and real media operations
        if: needs.foundation.outputs.core == 'true'
        run: python scripts/media-tools.py
      - name: Real native dependency operations
        if: needs.foundation.outputs.native == 'true'
        run: python scripts/qualify.py native
      - name: Cross-process CLI acceptance
        if: needs.foundation.outputs.cli == 'true'
        run: python scripts/qualify.py cli
      - name: Native credential lifecycle on Windows and macOS
        if: needs.foundation.outputs.native == 'true' && runner.os != 'Linux'
        run: python scripts/qualify.py secrets
      - name: Native credential lifecycle in private Linux Secret Service
        if: needs.foundation.outputs.native == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            fixture_root=$(mktemp -d)
            trap "rm -rf -- \"$fixture_root\"" EXIT
            export XDG_DATA_HOME="$fixture_root/data"
            export GNOME_KEYRING_CONTROL="$fixture_root/control"
            mkdir -p "$XDG_DATA_HOME" "$GNOME_KEYRING_CONTROL"
            python -c "import secrets,sys; sys.stdout.write(secrets.token_hex(32))" |
              gnome-keyring-daemon --daemonize --unlock --components=secrets --control-directory "$GNOME_KEYRING_CONTROL" >/dev/null
            python scripts/qualify.py secrets
          '
      - name: Install package notice inputs and build local help
        if: needs.foundation.outputs.native == 'true'
        run: |
          npm --prefix desktop/frontend ci --ignore-scripts
          npm --prefix site ci --ignore-scripts
          npm --prefix site run build
          python scripts/qualify.py assets
      - name: Check and build desktop frontend
        if: needs.foundation.outputs.native == 'true'
        run: |
          npm --prefix desktop/frontend run check
          npm --prefix desktop/frontend test
          npm --prefix desktop/frontend run build
      - name: Desktop shared bridge qualification
        if: needs.foundation.outputs.native == 'true'
        run: python scripts/qualify.py desktop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && needs.foundation.outputs.core == 'true'
        with:
          name: native-receipts-${{ matrix.os }}-${{ github.sha }}
          path: |
            build/native/*receipt.json
            build/native/package-inventory.json
          if-no-files-found: error
  packages:
    needs: [foundation, media]
    if: needs.foundation.outputs.native == 'true'
    name: package (${{ matrix.os }}, ${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        variant: [cli, desktop]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: 1
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - if: needs.foundation.outputs.core == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - if: needs.foundation.outputs.native == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Linux webview dependencies
        if: runner.os == 'Linux' && needs.foundation.outputs.native == 'true' && matrix.variant == 'desktop'
        run: |
          # The runner's Azure HTTP mirror can consume the complete job budget.
          # Preserve suites/components/signatures while using Ubuntu HTTPS.
          sudo python3 - <<'PY'
          from pathlib import Path
          import re
          for path in [Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.sources'), *Path('/etc/apt/sources.list.d').glob('*.list')]:
              if path.is_file():
                  original = path.read_text()
                  updated = re.sub(r'https?://azure[.]archive[.]ubuntu[.]com/ubuntu', 'https://archive.ubuntu.com/ubuntu', original)
                  if updated != original:
                      path.write_text(updated)
          PY
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav xvfb gnome-keyring dbus-x11 cmake ninja-build pkg-config nasm
      - name: Windows native compiler and loader dependencies
        if: runner.os == 'Windows' && needs.foundation.outputs.core == 'true'
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-openssl make diffutils
      - name: Bind the installed Windows toolchain
        if: runner.os == 'Windows' && needs.foundation.outputs.core == 'true'
        env:
          SELECTED_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: python -c "import os; assert os.environ['SELECTED_MSYS2_ROOT']; open(os.environ['GITHUB_ENV'],'a',encoding='utf-8',newline='\n').write('INSONIC_MSYS2_ROOT='+os.environ['SELECTED_MSYS2_ROOT']+'\n')"
      - name: Pinned Windows archive decoder
        if: runner.os == 'Windows' && needs.foundation.outputs.native == 'true'
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --target build/native/python zstandard==0.25.0
      - name: Pinned native artifacts
        if: needs.foundation.outputs.native == 'true'
        run: python scripts/qualify.py prepare
      - name: Download exact same-run source build
        if: needs.foundation.outputs.core == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: media-source-${{ matrix.os }}
          path: build/transfer
      - name: Verify source build transfer before reuse
        if: needs.foundation.outputs.core == 'true'
        shell: bash
        run: python scripts/media-transfer.py restore --stage complete --revision "$SOURCE_REVISION" build/transfer/media-source.tar.gz
      - name: Prepare pinned metadata extractors for package qualification
        if: needs.foundation.outputs.core == 'true'
        run: python scripts/media-tools.py --prepare-only
      - name: Install package notice inputs and build local help
        if: needs.foundation.outputs.native == 'true'
        run: |
          npm --prefix desktop/frontend ci --ignore-scripts
          npm --prefix site ci --ignore-scripts
          npm --prefix site run build
          python scripts/qualify.py assets
      - name: Build this desktop package frontend
        if: needs.foundation.outputs.native == 'true' && matrix.variant == 'desktop'
        run: |
          npm --prefix desktop/frontend run build
      - name: Assemble and qualify this relocated native package variant
        if: needs.foundation.outputs.native == 'true'
        run: python scripts/package-desktop.py all --variant ${{ matrix.variant }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && needs.foundation.outputs.core == 'true'
        with:
          name: package-receipts-${{ matrix.os }}-${{ matrix.variant }}-${{ github.sha }}
          path: |
            build/native/*receipt.json
            build/native/package-inventory.json
          if-no-files-found: error
  core-windows:
    needs: foundation
    if: needs.foundation.outputs.core == 'true'
    name: core (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Release schema test dependencies
        run: npm ci --ignore-scripts
      - name: Windows native compiler and loader dependencies
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-openssl
      - name: Bind the installed Windows toolchain
        env:
          SELECTED_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: python -c "import os; assert os.environ['SELECTED_MSYS2_ROOT']; open(os.environ['GITHUB_ENV'],'a',encoding='utf-8',newline='\n').write('INSONIC_MSYS2_ROOT='+os.environ['SELECTED_MSYS2_ROOT']+'\n')"
      - name: Core acceptance
        shell: bash
        run: |
          go test ./...
          go vet ./...
          python -m unittest discover -s tests -p '*_test.py'
  adapters:
    needs: [foundation, media]
    if: needs.foundation.outputs.adapters == 'true'
    name: adapter fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
      s3:
        image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
        ports: ['9090:9090']
      arcade:
        image: arcadedata/arcadedb:26.9.1@sha256:02a1a74fcef3c9d91e680262ddb7fde05ff9cfb356b366e7faf8e41d80995a70
        env:
          ARCADEDB_SETTINGS: -Darcadedb.server.rootPassword=fixture-only-password -Darcadedb.dumpConfigAtStartup=false
          ARCADEDB_OPTS_MEMORY: -Xms128M -Xmx512M
        ports: ['2480:2480']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Wait for bounded service fixtures
        run: |
          python - <<'PY'
          import time, urllib.request
          for url in ['http://localhost:9090/favicon.ico', 'http://localhost:2480/api/v1/ready']:
              for attempt in range(40):
                  try:
                      with urllib.request.urlopen(url, timeout=2):
                          break
                  except Exception:
                      time.sleep(2)
              else:
                  raise SystemExit('fixture did not become ready')
          PY
      - name: Download exact Linux source build for backend qualification
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: media-source-ubuntu-24.04
          path: build/transfer
      - name: Qualify alternative-backend operations
        env:
          INSONIC_FIXTURE_POSTGRES: postgres://fixture:fixture-only-password@localhost:5432/fixture?sslmode=disable
          INSONIC_FIXTURE_S3: localhost:9090
          INSONIC_FIXTURE_ARCADE: http://localhost:2480
          INSONIC_LIBRARY_TOOLS_FILE: ${{ github.workspace }}/build/native/media-tools.json
        run: |
          python scripts/media-transfer.py restore --stage complete --revision '${{ github.sha }}' build/transfer/media-source.tar.gz
          python scripts/media-tools.py --prepare-only
          go test -v -p 1 -tags integration ./internal/qualification ./internal/catalog ./internal/artifact ./internal/models ./internal/library ./internal/graph ./internal/app ./internal/backup
