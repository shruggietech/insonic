name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    name: foundation
    outputs:
      core: ${{ steps.scope.outputs.core }}
      cli: ${{ steps.scope.outputs.cli }}
      native: ${{ steps.scope.outputs.native }}
      adapters: ${{ steps.scope.outputs.adapters }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Classify affected components
        id: scope
        run: node scripts/ci-scope.mjs
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm --prefix site ci --ignore-scripts
      - run: npm --prefix site run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-${{ github.sha }}-${{ github.run_attempt }}
          path: site/out
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-help-${{ github.sha }}-${{ github.run_attempt }}
          path: site/offline
          if-no-files-found: error
          retention-days: 14
  media-linux:
    needs: foundation
    if: needs.foundation.outputs.native == 'true' || needs.foundation.outputs.adapters == 'true'
    uses: ./.github/workflows/media-source.yml
    with:
      revision: ${{ github.sha }}
      os: ubuntu-24.04
  qualify-linux:
    needs: [foundation, media-linux]
    if: always() && needs.foundation.result == 'success' && needs.foundation.outputs.core == 'true' && needs.media-linux.result == 'success'
    uses: ./.github/workflows/native-qualification.yml
    with:
      revision: ${{ github.sha }}
      os: ubuntu-24.04
      core: ${{ needs.foundation.outputs.core == 'true' }}
      cli: ${{ needs.foundation.outputs.cli == 'true' }}
      native: ${{ needs.foundation.outputs.native == 'true' }}
  media-windows:
    needs: foundation
    if: needs.foundation.outputs.native == 'true' || needs.foundation.outputs.adapters == 'true'
    uses: ./.github/workflows/media-source.yml
    with:
      revision: ${{ github.sha }}
      os: windows-2022
  qualify-windows:
    needs: [foundation, media-windows]
    if: always() && needs.foundation.result == 'success' && needs.foundation.outputs.core == 'true' && needs.media-windows.result == 'success'
    uses: ./.github/workflows/native-qualification.yml
    with:
      revision: ${{ github.sha }}
      os: windows-2022
      core: ${{ needs.foundation.outputs.core == 'true' }}
      cli: ${{ needs.foundation.outputs.cli == 'true' }}
      native: ${{ needs.foundation.outputs.native == 'true' }}
  media-macos:
    needs: foundation
    if: needs.foundation.outputs.native == 'true' || needs.foundation.outputs.adapters == 'true'
    uses: ./.github/workflows/media-source.yml
    with:
      revision: ${{ github.sha }}
      os: macos-15
  qualify-macos:
    needs: [foundation, media-macos]
    if: always() && needs.foundation.result == 'success' && needs.foundation.outputs.core == 'true' && needs.media-macos.result == 'success'
    uses: ./.github/workflows/native-qualification.yml
    with:
      revision: ${{ github.sha }}
      os: macos-15
      core: ${{ needs.foundation.outputs.core == 'true' }}
      cli: ${{ needs.foundation.outputs.cli == 'true' }}
      native: ${{ needs.foundation.outputs.native == 'true' }}
  core:
    needs: foundation
    if: needs.foundation.outputs.core == 'true'
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Release schema test dependencies
        run: npm ci --ignore-scripts
      - name: Core acceptance
        shell: bash
        run: |
          go test ./...
          go vet ./...
          python -m unittest discover -s tests -p '*_test.py'
  core-windows:
    needs: foundation
    if: needs.foundation.outputs.core == 'true'
    name: core (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Release schema test dependencies
        run: npm ci --ignore-scripts
      - name: Windows native compiler and loader dependencies
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-openssl
      - name: Bind the installed Windows toolchain
        env:
          SELECTED_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: python -c "import os; assert os.environ['SELECTED_MSYS2_ROOT']; open(os.environ['GITHUB_ENV'],'a',encoding='utf-8',newline='\n').write('INSONIC_MSYS2_ROOT='+os.environ['SELECTED_MSYS2_ROOT']+'\n')"
      - name: Core acceptance
        shell: bash
        run: |
          go test ./...
          go vet ./...
          python -m unittest discover -s tests -p '*_test.py'
  adapters:
    needs: [foundation, media-linux]
    if: always() && needs.foundation.result == 'success' && needs.foundation.outputs.adapters == 'true' && needs.media-linux.result == 'success'
    name: adapter fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
      s3:
        image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
        ports: ['9090:9090']
      arcade:
        image: arcadedata/arcadedb:26.9.1@sha256:02a1a74fcef3c9d91e680262ddb7fde05ff9cfb356b366e7faf8e41d80995a70
        env:
          ARCADEDB_SETTINGS: -Darcadedb.server.rootPassword=fixture-only-password -Darcadedb.dumpConfigAtStartup=false
          ARCADEDB_OPTS_MEMORY: -Xms128M -Xmx512M
        ports: ['2480:2480']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Wait for bounded service fixtures
        run: |
          python - <<'PY'
          import time, urllib.request
          for url in ['http://localhost:9090/favicon.ico', 'http://localhost:2480/api/v1/ready']:
              for attempt in range(40):
                  try:
                      with urllib.request.urlopen(url, timeout=2):
                          break
                  except Exception:
                      time.sleep(2)
              else:
                  raise SystemExit('fixture did not become ready')
          PY
      - name: Download exact Linux source build for backend qualification
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: media-source-ubuntu-24.04-${{ github.run_attempt }}
          path: build/transfer
      - name: Qualify alternative-backend operations
        env:
          INSONIC_FIXTURE_POSTGRES: postgres://fixture:fixture-only-password@localhost:5432/fixture?sslmode=disable
          INSONIC_FIXTURE_S3: localhost:9090
          INSONIC_FIXTURE_ARCADE: http://localhost:2480
          INSONIC_LIBRARY_TOOLS_FILE: ${{ github.workspace }}/build/native/media-tools.json
        run: |
          python scripts/media-transfer.py restore --stage complete --revision '${{ github.sha }}' build/transfer/media-source.tar.gz
          python scripts/media-tools.py --prepare-only
          go test -v -p 1 -tags integration ./internal/qualification ./internal/catalog ./internal/artifact ./internal/models ./internal/library ./internal/graph ./internal/app ./internal/backup
