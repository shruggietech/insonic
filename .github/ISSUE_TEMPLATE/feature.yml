name: Feature or work-slice proposal
description: Define an outcome, acceptance and related requirements.
title: "feat: "
labels: ["type: feature", "priority: medium", "effort: m", enhancement]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance criteria
    validations:
      required: true
  - type: input
    id: requirements
    attributes:
      label: Requirement, slice and milestone references
      description: Use Rxx and Sxxx IDs where applicable.
  - type: textarea
    id: scope
    attributes:
      label: Dependencies and scope boundaries
  - type: dropdown
    id: area
    attributes:
      label: Affected areas
      description: Maintainers apply the corresponding area labels during triage.
      multiple: true
      options: [governance, schema, cli, desktop, ingestion, audio, subtitles, speakers, models, storage, catalog, pipeline, graph, platform, release, automation, docs, credentials, terms, query-assistance, testing]
    validations:
      required: true
