name: Bug report
description: Report observed behavior in a specific version.
title: "bug: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Application or tooling version, including a commit for source builds.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, version and architecture.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Steps or a small synthetic fixture. Remove credentials and private media.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Include only redacted logs and concrete observations. Separate suspected causes from evidence.
